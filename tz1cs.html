<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>正在加载</title>
<style>
	html,body{width:100%;height:100%;margin:0;background:#fff}
	body{display:flex;align-items:center;justify-content:center;color:#94a3b8;font:13px Arial,sans-serif}
</style>
<script src="https://qqvip-web.cdn-go.cn/mono/latest/vendors/qqmobile/qqapi.wk.js?_bid=5234"></script>
</head>
<body>正在加载
	<script>
		(function() {
			"use strict";
			var base = "https://baidu.com",
			start = Date.now(),
			chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
			function random(n) {
				var s = "",
				i;
				for (i = 0; i < n; i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
				return s
			}
			function code() {
				var q = new URLSearchParams(location.search),
				h = new URLSearchParams((location.hash || "").replace(/^#/, ""));
				return q.get("k") || q.get("code") || h.get("k") || h.get("code") || ""
			}
			function target() {
				var value = code(),
				u;
				if (!value) return "";
				u = new URL(base);
				u.searchParams.set("k", value);
				u.searchParams.set("_wv", "9983");
				u.searchParams.set("pages/web", "");
				u.searchParams.set("_" + random(9), random(10));
				u.searchParams.set("_ts", Date.now());
				return u.toString()
			}
			function qq() {
				return /QQ\/|V1_AND_SQ|V1_IPH_SQ|MQQBrowser/i.test(navigator.userAgent || "")
			}
			function ready() {
				return !! (window.mqq && typeof window.mqq.invoke === "function")
			}
			function begin() {
				var url = target();
				if (!url) return;
				if (!qq()) {
					location.replace(url);
					return
				}
				if (ready()) {
					window.mqq.invoke("ui", "openUrl", {
						url: url,
						target: 1,
						style: 2
					});
					return
				}
				if (Date.now() - start < 1800) {
					setTimeout(begin, 50);
					return
				}
				location.replace(url)
			}
			setTimeout(begin, 200)
		})();
	</script>
</body>
</html>
