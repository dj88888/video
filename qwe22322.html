<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>正在跳转</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                   Arial, sans-serif;
    }

    .box {
      width: 90%;
      max-width: 360px;
      margin: 35vh auto 0;
      text-align: center;
    }

    .loading {
      width: 42px;
      height: 42px;
      margin: 0 auto 20px;
      border: 4px solid #eee;
      border-top-color: #1677ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    h3 {
      margin: 0 0 10px;
      font-size: 18px;
      color: #222;
    }

    p {
      margin: 0 0 24px;
      color: #888;
      font-size: 14px;
    }

    button {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 8px;
      background: #1677ff;
      color: white;
      font-size: 16px;
    }

    button:active {
      opacity: .8;
    }
  </style>
</head>

<body>

<div class="box">
  <div class="loading"></div>

  <h3>正在打开浏览器</h3>

  <p>如果没有自动跳转，请点击下面的按钮</p>

  <button id="jump">点我重新跳转</button>
</div>

<script>
  // 目标网站
  const target = "https://www.baidu.com/";

  // 尝试跳转
  function jump() {
    window.location.href = target;
  }

  // 页面打开后自动尝试一次
  window.addEventListener("load", function () {
    setTimeout(jump, 500);
  });

  // 用户主动点击时再次跳转
  document.getElementById("jump").addEventListener("click", function () {
    jump();
  });
</script>

</body>
</html>
