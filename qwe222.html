<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正在处理</title>
</head>

<body style="text-align:center;padding-top:30vh;font-family:sans-serif">

<div id="qq">
  <h3>请使用浏览器打开</h3>
  <p>请点击右上角菜单，选择“在浏览器中打开”。</p>
</div>

<div id="normal" style="display:none">
  <p>正在跳转...</p>
</div>

<script>
const target = "https://www.baidu.com/";

const ua = navigator.userAgent.toLowerCase();

const isQQ = ua.includes("qq/");
const isWeChat = ua.includes("micromessenger");

if (isQQ || isWeChat) {
  // QQ / 微信内置浏览器：不自动绕过
  document.getElementById("qq").style.display = "block";
} else {
  // Safari / Chrome 等正常浏览器
  document.getElementById("qq").style.display = "none";
  document.getElementById("normal").style.display = "block";

  setTimeout(() => {
    location.replace(target);
  }, 500);
}
</script>

</body>
</html>
