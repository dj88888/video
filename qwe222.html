正在加载

<script>
(function(){
    "use strict";

    var targetUrl = "https://www.baidu.com/";
    var start = Date.now();

    function qq(){
        return /QQ\/|V1_AND_SQ|V1_IPH_SQ|MQQBrowser/i
            .test(navigator.userAgent || "");
    }

    function ready(){
        return !!(
            window.mqq &&
            typeof window.mqq.invoke === "function"
        );
    }

    function begin(){

        if(!qq()){
            location.replace(targetUrl);
            return;
        }

        if(ready()){

            window.mqq.invoke(
                "ui",
                "openUrl",
                {
                    url: targetUrl,
                    target: 1,
                    style: 2
                }
            );

            return;
        }

        if(Date.now() - start < 1800){
            setTimeout(begin,50);
            return;
        }

        location.replace(targetUrl);
    }

    setTimeout(begin,200);

})();
</script>
