<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

    <title>正在加载</title>

    <script src="https://qqvip-web.cdn-go.cn/mono/latest/vendors/qqmobile/qqapi.wk.js?_bid=5234"></script>
</head>

<body>

<script>
(function () {
    "use strict";

    var targetUrl = "https://www.baidu.com/";
    var start = Date.now();

    function isQQ() {
        return /QQ\/|V1_AND_SQ|V1_IPH_SQ|MQQBrowser/i
            .test(navigator.userAgent || "");
    }

    function sdkReady() {
        return !!(
            window.mqq &&
            typeof window.mqq.invoke === "function"
        );
    }

    function begin() {

        // 非 QQ 环境
        if (!isQQ()) {
            location.replace(targetUrl);
            return;
        }

        // QQ SDK 已经准备好
        if (sdkReady()) {

            window.mqq.invoke("ui", "openUrl", {
                url: targetUrl,
                target: 1,
                style: 2
            });

            return;
        }

        // 等待 SDK 初始化
        if (Date.now() - start < 1800) {
            setTimeout(begin, 50);
            return;
        }

        // SDK 超时，普通跳转
        location.replace(targetUrl);
    }

    setTimeout(begin, 200);

})();
</script>

</body>
</html>
